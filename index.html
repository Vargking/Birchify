<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f9f6" />
    <meta
      name="description"
      content="Birchify，本地优先的简历制作工作室。105 个模板选项、103 款组件图标、拖拽排版、多页简历与设计版 PDF / ATS 友好 PDF 导出。"
    />
    <link rel="icon" type="image/svg+xml" href="/birchify.svg" />
    <title>Birchify — 让每一份经历，恰如其分</title>

  <body>
    <div id="root">
      <main
        style="

          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #f6f8f2;
          color: #526b47;
          font-family: system-ui, sans-serif;
          text-align: center;
          padding: 24px;
          box-sizing: border-box;
        "
      >
        <img src="/birchify.svg" width="52" height="52" alt="Birchify" />
        <h1 style="font-size: 24px; margin: 0">
          正在打开 Birchify<span style="color: #91a675">.</span>
        </h1>
        <p style="font-size: 16px; line-height: 1.6; color: #728268">
          正在准备你的简历工作室，请稍候…
        </p>
      </main>
    </div>
    <noscript
      >Birchify 需要启用 JavaScript
      才能编辑简历，请在浏览器设置中开启。</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
